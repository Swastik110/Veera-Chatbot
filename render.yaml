services:
  - type: web
    name: magicpin-vera-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /v1/healthz
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-2.0-flash
  - type: web
    name: magicpin-vera-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://magicpin-vera-backend.onrender.com
